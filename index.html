<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Uqdah Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centred column that reads top to bottom: application, answer, why, what to check, decision. Details stay folded. */
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --sunken: #edf1f5;
  --ink: #142030;
  --ink-2: #4a5768;
  --ink-3: #7a8696;
  --line: #dbe2ea;
  --accent: #1f5fae;
  --accent-soft: #e3edf9;
  --accent-ink: #ffffff;
  --red: #b3352b;
  --red-soft: #fbe7e4;
  --amber: #8a5c00;
  --amber-soft: #f8edd4;
  --green: #2e6b3d;
  --green-soft: #e2f0e4;
  --font: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-ar: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #161e27; --sunken: #1d2732; --ink: #e4eaf1; --ink-2: #a7b3c1; --ink-3: #7d8998; --line: #283442;
    --accent: #7fb0ec; --accent-soft: #1b2d44; --accent-ink: #0d1623;
    --red: #f08277; --red-soft: #3b201e; --amber: #e3b65e; --amber-soft: #352b17; --green: #8cc79a; --green-soft: #1b3122;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #161e27; --sunken: #1d2732; --ink: #e4eaf1; --ink-2: #a7b3c1; --ink-3: #7d8998; --line: #283442;
  --accent: #7fb0ec; --accent-soft: #1b2d44; --accent-ink: #0d1623;
  --red: #f08277; --red-soft: #3b201e; --amber: #e3b65e; --amber-soft: #352b17; --green: #8cc79a; --green-soft: #1b3122;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; touch-action: manipulation; }
html[lang="ar"] body { font-family: var(--font-ar); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 20px; font-family: var(--font-ar); }
nav.views { display: flex; gap: 4px; }
nav.views a { color: var(--ink-2); text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: 15px; font-weight: 500; }
nav.views a[aria-current="page"] { color: var(--ink); background: var(--sunken); }
.tools { margin-inline-start: auto; display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 500; min-height: 40px; }
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.07); }
.notice { font-size: 13.5px; color: var(--ink-2); padding-block: 10px 0; }

main { padding-block: 28px 80px; display: grid; gap: 28px; }

/* Sample switch */
.samples { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.samples span { color: var(--ink-2); font-size: 14px; }
.seg { display: inline-flex; background: var(--sunken); border-radius: 10px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: 14.5px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 32, 48, .12); }

/* Application */
.app { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: grid; gap: 14px; }
.app-label { font-size: 14px; color: var(--ink-3); }
.app h1 { font-size: 26px; font-weight: 600; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; }
.fact dt { font-size: 13.5px; color: var(--ink-3); }
.fact dd { margin: 0; font-weight: 500; }
.needs { font-size: 14.5px; color: var(--ink-2); }
.needs b { color: var(--ink); font-weight: 500; }

/* Answer */
.answer { border-radius: 12px; padding: 22px; display: grid; gap: 8px; border: 1px solid transparent; }
.answer.red { background: var(--red-soft); border-color: color-mix(in srgb, var(--red) 30%, transparent); }
.answer.amber { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 30%, transparent); }
.answer.green { background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 30%, transparent); }
.answer .tag { font-size: 14px; font-weight: 600; }
.answer.red .tag { color: var(--red); } .answer.amber .tag { color: var(--amber); } .answer.green .tag { color: var(--green); }
.answer h2 { font-size: 22px; font-weight: 600; }
.answer p { color: var(--ink); max-width: 64ch; }

/* Finding */
.sec-h { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
.finding { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: grid; gap: 18px; }
.finding + .finding { margin-top: 14px; }
.f-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.f-head h3 { font-size: 18px; font-weight: 600; }
.f-role { color: var(--ink-3); font-size: 14px; }
.f-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center; }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram text { font-family: var(--font); font-size: 13px; fill: var(--ink-2); }
html[lang="ar"] .diagram text { font-family: var(--font-ar); }
.payout { display: grid; gap: 12px; }
.payout-q { font-weight: 500; }
.pbar { display: grid; gap: 4px; }
.pbar-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14.5px; }
.pbar-top b { font-weight: 600; }
.track { position: relative; height: 14px; background: var(--sunken); border-radius: 4px; }
.fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 4px; background: var(--ink-3); }
.fill.now { background: var(--accent); }
.fill.over { background: var(--red); }
.limit { position: absolute; inset-block: -5px; width: 2px; background: var(--ink); }
.limit-note { font-size: 13.5px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.limit-note i { width: 2px; height: 14px; background: var(--ink); display: inline-block; }
.f-notes { display: grid; gap: 6px; font-size: 14.5px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 14px; }

/* Checks */
.checks { display: grid; gap: 10px; }
.check { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.check-mark { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 8px; }
.check-mark.amber { background: var(--amber); } .check-mark.green { background: var(--green); } .check-mark.grey { background: var(--ink-3); }
.check-text { flex: 1 1 260px; min-width: 0; }
.check-text small { display: block; color: var(--ink-3); font-size: 13.5px; }
.check-actions { display: flex; gap: 8px; }

/* Decision */
.decide { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: grid; gap: 14px; }
.decide-hint { font-size: 14px; color: var(--ink-3); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 500; font-size: 15px; min-height: 40px; }
.choices button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; color: var(--ink-2); }
textarea { width: 100%; min-height: 80px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); resize: vertical; font-size: 16px; }
.recorded { font-size: 14.5px; color: var(--green); font-weight: 500; }

/* Details */
details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
details + details { margin-top: 10px; }
summary { cursor: pointer; padding: 14px 18px; font-weight: 500; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--ink-3); font-weight: 400; }
details[open] summary::after { content: "−"; }
.d-body { padding: 0 18px 18px; display: grid; gap: 14px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-3); font-weight: 500; font-size: 13px; white-space: nowrap; }
td.r, th.r { text-align: end; }
.src { color: var(--ink-3); font-size: 13px; }
.formula { font-size: 14px; color: var(--ink-2); max-width: 70ch; }

/* How it works */
.how { display: grid; gap: 28px; }
.how h1 { font-size: 26px; font-weight: 600; }
.lede { color: var(--ink-2); max-width: 62ch; margin-top: 6px; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: s; }
ol.steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 4px 12px; }
ol.steps li::before { content: counter(s); grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
ol.steps b { font-weight: 600; }
ol.steps span { color: var(--ink-2); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.box h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.box ul { margin: 0; padding-inline-start: 18px; display: grid; gap: 6px; color: var(--ink-2); }

/* Intro, tour, ending */
.intro { min-height: 62vh; display: grid; align-content: center; gap: 22px; padding-block: 40px; }
.intro .kicker { color: var(--accent); font-weight: 600; font-size: 15px; }
.intro h1 { font-size: clamp(26px, 4.4vw, 40px); font-weight: 600; max-width: 22ch; line-height: 1.25; }
.intro p { color: var(--ink-2); font-size: 18px; max-width: 52ch; }
.intro .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn-lg { padding: 12px 22px; font-size: 17px; min-height: 48px; border-radius: 10px; }
.linkbtn { background: none; border: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 15px; padding: 8px 4px; }
.end-list { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-width: 620px; }
.end-list div { display: flex; justify-content: space-between; gap: 16px; padding: 14px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.end-list div:first-child { border-top: 0; }
.end-list span { color: var(--ink-2); }
.end-list b { font-weight: 600; }
body.touring #view-check > * { opacity: .28; transition: opacity .25s ease; pointer-events: none; }
body.touring #view-check .spot-wrap { opacity: 1; }
body.touring .spot { opacity: 1 !important; outline: 3px solid var(--accent); outline-offset: 6px; border-radius: 12px; position: relative; z-index: 1; }
body.touring .spot-wrap > *:not(.spot):not(.spot-wrap):not(.sec-h) { opacity: .28; }
body.touring main#view-check { padding-bottom: 260px; }
.guide { position: fixed; z-index: 20; inset-inline: 0; bottom: 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.guide-card { pointer-events: auto; max-width: 620px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(10, 20, 30, .25); }
.guide-step { font-size: 13.5px; opacity: .75; }
.guide-text { font-size: 17px; line-height: 1.5; }
.guide-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.guide-row .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
.guide-row .btn-primary { background: var(--bg); color: var(--ink); border-color: var(--bg); }
.dots { display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--bg); opacity: .3; }
.dots i.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { body.touring #view-check > * { transition: none; } }

/* AI panel */
.ai-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: grid; gap: 14px; margin-bottom: 14px; }
.ai-panel textarea { font-size: 15px; line-height: 1.5; }
.ai-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ai-status { font-size: 14px; color: var(--ink-2); }
.ai-status:empty { display: none; }
.ai-warn { background: var(--amber-soft); color: var(--ink); padding: 8px 12px; border-radius: 8px; font-size: 14px; }
.ai-out { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.ai-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; font-size: 15px; }
.ai-row > span:first-child { color: var(--ink-3); font-size: 14px; }
.ai-conf { color: var(--ink-3); font-size: 13px; }
.timed { font-size: 13.5px; color: var(--ink-3); margin-top: -16px; }
.section-label { font-weight: 600; font-size: 15px; }
@media (max-width: 680px) { .ai-row { grid-template-columns: 1fr; gap: 2px; } }

/* Blue "shared, within limit" answer */
.answer.blue { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.answer.blue .tag { color: var(--accent); }

/* Application form */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-grid .field input, .form-grid .field select { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--surface); font-size: 16px; }
.form-sub { font-size: 15px; font-weight: 600; margin-top: 6px; }
.form-hint { font-size: 13.5px; color: var(--ink-3); }
.app-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }

/* Source links and documents */
.doclink { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; text-align: start; }
dialog.doc { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--ink); }
dialog.doc::backdrop { background: rgba(10, 18, 28, .45); }
.doc-h { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 18px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.doc-h small { display: block; color: var(--amber); font-size: 13px; font-weight: 500; }
.doc-b { padding: 18px; display: grid; gap: 22px; }
.doc-b h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.doc-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; margin: 0; }
.doc-facts dt { font-size: 13px; color: var(--ink-3); }
.doc-facts dd { margin: 0; font-weight: 500; }
tr.hl td { background: var(--amber-soft); }
.clause { border-inline-start: 3px solid var(--line); padding: 8px 12px; background: var(--bg); border-radius: 4px; }
.clause.hl { border-color: var(--amber); background: var(--amber-soft); }

@media (max-width: 680px) {
  .form-grid { grid-template-columns: 1fr; }
  .f-body, .two { grid-template-columns: 1fr; }
  .app h1, .how h1 { font-size: 22px; }
  .answer h2 { font-size: 19px; }
  nav.views { order: 3; width: 100%; }
}

.top .wrap, #view-simple { max-width: 1160px; }
#view-simple { padding-block: 0; margin-block: 0; }
.q { display: grid; gap: 28px; padding-block: 32px 48px; }
.q-in { display: grid; gap: 16px; align-content: start; }
.q-empty { border: 1px dashed var(--line); border-radius: 12px; padding: 40px 22px; text-align: center; color: var(--ink-3); font-size: 15px; }
.q-ans { align-content: start; }
.q-more { justify-self: start; }
.q-det { display: grid; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; scroll-margin-top: 80px; }
.q-det[hidden] { display: none; }
.q-det-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.q-det-h h2 { font-size: 18px; font-weight: 600; }
.q-body { display: grid; gap: 28px; }
.q-col { display: grid; gap: 24px; align-content: start; min-width: 0; }

@media (min-width: 900px) {
  .q { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 48px; row-gap: 32px; padding-block: 56px 64px; align-items: start; }
  .q-ans { padding-top: 72px; }
  .q-det { grid-column: 1 / -1; padding: 28px; }
  .q-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 48px; }
  .q textarea { min-height: 240px; }
}
.q h1 { font-size: 26px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; }
.q textarea { min-height: 150px; font-size: 15.5px; line-height: 1.55; }
.q-actions { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.q-ans { display: grid; gap: 12px; }
.q-ans:empty { display: none; }
.q-read { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.q-read span { color: var(--ink-2); }
.q-read b { font-weight: 500; text-align: end; }
.q-graph { display: grid; gap: 16px; }
.q-links { display: flex; gap: 20px; font-size: 14.5px; }
.q-links a { color: var(--ink-2); text-underline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 600px) { .q { padding-top: 24px; } .q h1 { font-size: 21px; } }
.q-seg { margin-top: 8px; }
.q-links-list { display: grid; gap: 0; margin-top: 8px; }
.q-link { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.q-link div { display: grid; gap: 2px; min-width: 0; }
.q-link b { font-weight: 500; }
.q-link small { color: var(--ink-2); font-size: 13.5px; }
.q-link.off b { color: var(--ink-3); text-decoration: line-through; }
.q-link .btn { flex: none; font-size: 14px; }
.q-conc { display: grid; gap: 6px; margin-top: 12px; }
.q-conc small { color: var(--ink-2); font-weight: 400; }
.q-conc .fill { background: var(--ink-2); }
.q-link small .doclink { font-size: 13.5px; }
.q-choices { margin-top: 8px; }
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#">
      <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true">

        <g fill="var(--surface)" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="7" r="3"/><circle cx="22" cy="7" r="3"/><circle cx="14" cy="23" r="3"/></g>

<script>
/* Uqdah in-browser extraction. Model: multilingual-e5-small (int8 ONNX), served as same-origin chunks. */
window.UqdahAI = (function () {
  "use strict";
  const BASE = "./ai/";
  const CHUNKS = {
    wasm: { n: 2, size: 21596019 },
    "multilingual-e5-small/tokenizer.json": { n: 2, size: 17082730 },
    "multilingual-e5-small/onnx/model_quantized.onnx": { n: 9, size: 118308185 }
  };
  const TOTAL = Object.values(CHUNKS).reduce((s, c) => s + c.size, 0);
  let loaded = 0, onProgress = () => {}, extractor = null, loading = null;

  async function fetchChunks(path, n) {
    const parts = [];
    for (let i = 0; i < n; i++) {
      const res = await fetch(`${BASE}${path}.${i}.wasm`);
      if (!res.ok) throw new Error(`Could not load ${path} part ${i} (${res.status})`);
      const reader = res.body.getReader(); const bufs = [];
      for (;;) { const { done, value } = await reader.read(); if (done) break; bufs.push(value); loaded += value.length; onProgress(loaded / TOTAL); }
      parts.push(new Blob(bufs));
    }
    return new Blob(parts);
  }

  function load(progress) {
    if (extractor) return Promise.resolve(extractor);
    if (loading) return loading;
    onProgress = progress || (() => {});
    loading = (async () => {
      const tf = await import(new URL(BASE + "transformers.min.js", location.href).href);
      const env = tf.env;
      env.allowRemoteModels = false;
      env.allowLocalModels = true;
      env.localModelPath = new URL(BASE + "models/", location.href).href;
      env.useBrowserCache = false;
      env.useCustomCache = true;
      env.customCache = {
        async match(key) {
          const k = String(key && key.url ? key.url : key);
          for (const p in CHUNKS) {
            if (p !== "wasm" && k.endsWith(p)) { const b = await fetchChunks("models/" + p, CHUNKS[p].n); return new Response(b); }
          }
          return undefined;
        },
        async put() {}
      };
      const wasm = await fetchChunks("ort.wasm", CHUNKS.wasm.n);
      const o = env.backends.onnx.wasm;
      o.wasmBinary = await wasm.arrayBuffer();
      o.wasmPaths = { mjs: new URL(BASE + "ort-wasm-simd-threaded.jsep.mjs", location.href).href, wasm: new URL(BASE + "ort.wasm.0.wasm", location.href).href };
      o.numThreads = 1;
      o.proxy = false;
      extractor = await tf.pipeline("feature-extraction", "multilingual-e5-small", { dtype: "q8", device: "wasm" });
      onProgress(1);
      return extractor;
    })();
    loading.catch(() => { loading = null; });
    return loading;
  }

  async function embed(texts, prefix) {
    const out = await extractor(texts.map(t => (prefix || "query: ") + t), { pooling: "mean", normalize: true });
    return out.tolist();
  }
  const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };

  const PROTOS = {
    power: ["temporary power supplier and generators", "electricity generator rental company", "power will be supplied by", "مورد الطاقة المؤقتة والمولدات الكهربائية", "شركة تأجير المولدات وتوفير الكهرباء", "توفير الطاقة الكهربائية للفعالية"],
    stage: ["stage, sound and lighting supplier", "audio visual and stage production company", "sound system and stage provided by", "مورد المسرح والصوتيات والإضاءة", "شركة الصوتيات والإنتاج المسرحي", "تجهيز المسرح والصوت"],
    venue: ["the event venue, hall or exhibition centre", "the event will be held at this location", "مكان إقامة الفعالية أو القاعة أو مركز المعارض", "تقام الفعالية في هذا الموقع"],
    other: ["insurance application for an event", "طلب تأمين لفعالية", "catering and food services", "security guards and crowd management", "ticketing and registration", "insurance cancellation limit and deductible amount", "event name and dates", "number of expected visitors", "خدمات الإعاشة والضيافة", "الأمن وإدارة الحشود", "حد التعويض والتحمل", "اسم الفعالية وتاريخها", "عدد الزوار المتوقع"]
  };
  let protoVecs = null;

  /* Rules for things that need no model: dates, amounts, registration numbers. */
  const MONTHS = { jan: 1, january: 1, feb: 2, february: 2, mar: 3, march: 3, apr: 4, april: 4, may: 5, jun: 6, june: 6, jul: 7, july: 7, aug: 8, august: 8, sep: 9, sept: 9, september: 9, oct: 10, october: 10, nov: 11, november: 11, dec: 12, december: 12,
    "يناير": 1, "فبراير": 2, "مارس": 3, "أبريل": 4, "ابريل": 4, "مايو": 5, "يونيو": 6, "يوليو": 7, "أغسطس": 8, "اغسطس": 8, "سبتمبر": 9, "أكتوبر": 10, "اكتوبر": 10, "نوفمبر": 11, "ديسمبر": 12 };
  const toLatin = s => s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
  const iso = (y, m, d) => `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  function findDates(text) {
    const s = toLatin(text), out = [];
    let m;
    const r1 = /(\d{4})-(\d{1,2})-(\d{1,2})/g; while ((m = r1.exec(s))) out.push({ i: m.index, v: iso(m[1], m[2], m[3]) });
    const r2 = /(\d{1,2})\s*(?:(?:-|–|to|إلى|الى|حتى|و)\s*(\d{1,2})\s+)?([A-Za-z؀-ۿ]+)\s+(\d{4})/g;
    while ((m = r2.exec(s))) { const mo = MONTHS[m[3].toLowerCase()]; if (mo) { out.push({ i: m.index, v: iso(m[4], mo, m[1]) }); if (m[2]) out.push({ i: m.index + 1, v: iso(m[4], mo, m[2]) }); } }
    const r3 = /([A-Za-z]+)\s+(\d{1,2})(?:\s*(?:-|–|to)\s*(\d{1,2}))?,?\s+(\d{4})/g;
    while ((m = r3.exec(s))) { const mo = MONTHS[m[1].toLowerCase()]; if (mo) { out.push({ i: m.index, v: iso(m[4], mo, m[2]) }); if (m[3]) out.push({ i: m.index + 1, v: iso(m[4], mo, m[3]) }); } }
    return out.sort((a, b) => a.i - b.i).map(x => x.v);
  }
  function findAmount(text, words) {
    const s = toLatin(text);
    for (const line of s.split(/\n|[.;؛]/)) {
      if (!words.test(line)) continue;
      const m = line.match(/(\d[\d,\s]*(?:\.\d+)?)\s*(million|m\b|مليون)?/i);
      if (m) { let v = parseFloat(m[1].replace(/[,\s]/g, "")); if (m[2]) v *= 1e6; if (v > 0) return Math.round(v); }
    }
    return null;
  }
  const findCr = seg => { const m = toLatin(seg).match(/\b(\d{10})\b/); return m ? m[1] : ""; };

  function segments(text) {
    return text.split(/\n+/).flatMap(l => l.split(/(?<=[.؛;])\s+/)).map(s => s.trim()).filter(s => s.length > 3);
  }
  function cleanName(seg, role) {
    let s = seg;
    const colon = s.lastIndexOf(":"); if (colon >= 0 && colon < s.length - 2) s = s.slice(colon + 1);
    const pats = [/\b(?:by|from|with)\s+(.+)/i, /\b(?:held at|takes place at|at)\s+(.+)/i, /(?:بواسطة|من قبل|عن طريق|تقدمه|يقدمها|يوفرها|توفرها)\s+(.+)/, /(?:تقام في|تُقام في|في)\s+(.+)/];
    for (const p of pats) { const m = s.match(p); if (m && m[1].length > 2) { s = m[1]; break; } }
    s = s.replace(/\(.*?\)/g, " ")
      .replace(/\b(?:CR|C\.R\.|registration|reg\.?\s*no\.?)\b.*$/i, " ")
      .replace(/(?:سجل تجاري|رقم السجل|س\.ت).*$/, " ")
      .replace(/\d{6,}/g, " ")
      .split(/,|،| on | from \d| between |\s-\s|\bon\b|\bduring\b|خلال|بتاريخ|من يوم/)[0]
      .replace(/^(?:the|a)\s+/i, "")
      .replace(/[.;؛]+$/, "").replace(/\s+/g, " ").trim();
    return s;
  }

  async function extract(text) {
    if (!extractor) throw new Error("model not loaded");
    const t0 = performance.now();
    if (!protoVecs) {
      protoVecs = {};
      for (const k in PROTOS) protoVecs[k] = await embed(PROTOS[k], "query: ");
    }
    const segs = segments(text);
    const vecs = segs.length ? await embed(segs, "query: ") : [];
    const found = {}, scored = [];
    segs.forEach((seg, i) => {
      const sc = {};
      for (const k in protoVecs) sc[k] = Math.max(...protoVecs[k].map(p => dot(p, vecs[i])));
      const ranked = Object.entries(sc).sort((a, b) => b[1] - a[1]);
      const [role, best] = ranked[0], margin = best - ranked[1][1];
      scored.push({ seg, role, score: best, margin });
      const ruleOnly = /\d{4}|SAR|ريال|deductible|limit|التحمل|حد التعويض/i.test(seg) && !findCr(seg);
      if (!ruleOnly && role !== "other" && margin > 0.01 && (!found[role] || best > found[role].score)) {
        const name = cleanName(seg, role);
        if (name) found[role] = { name, cr: findCr(seg), score: best, seg };
      }
    });
    const dates = findDates(text);
    const lines = text.split(/\n/).map(s => s.trim()).filter(Boolean);
    let name = "";
    const nm = text.match(/^\s*(?:application|insurance application|event name|event|طلب تأمين|طلب|اسم الفعالية)\s*[:：]\s*(.+)$/im);
    if (nm) name = nm[1].split(/,|،/)[0].trim(); else if (lines[0] && lines[0].length < 80) name = lines[0];
    const res = {
      name,
      start: dates[0] || "", end: dates[1] || dates[0] || "",
      limit: findAmount(text, /limit|cover|sum insured|حد|تغطية|مبلغ التأمين/i),
      ded: findAmount(text, /deductible|excess|تحمل|التحمّل|التحمل/i),
      venue: found.venue || null, power: found.power || null, stage: found.stage || null,
      segments: scored, ms: Math.round(performance.now() - t0)
    };
    return res;
  }

  async function similar(a, list) {
    const v = await embed([a].concat(list), "query: ");
    return list.map((x, i) => dot(v[0], v[i + 1]));
  }

  return { load, extract, similar, isLoaded: () => !!extractor, totalBytes: TOTAL, findDates };
})();

function norm(s) {

    .replace(/&/g, " and ").replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/)

}
function dice(a, b) {

const netOf = l => (l.x.alt || l.p.cover !== "covered") ? 0 : l.p.limit - l.p.ded;

function concentration() {
  const out = [];
  for (const id in ENT) {
    const ls = []; POLICIES.forEach(p => p.deps.forEach(x => { if (x.e === id && !S.excl[p.id + ":" + id]) ls.push({ p, x }); }));
    if (!ls.length) continue;
    const lo = Math.min(...ls.map(l => day(l.x.from))), hi = Math.max(...ls.map(l => day(l.x.to)));
    let peak = 0, at = lo, n = 0;

function analyse(app) {

  const [pf, pt] = depPeriod(app);
  const ws = day(pf), we = day(pt);
  const findings = [], checks = [];
  app.deps.forEach((d, i) => {
    const key = app.key + ":" + i + ":" + norm(d.raw), r = resolve(d, key);
    if (r.how === "pending") checks.push({ kind: "match", key, raw: d.raw, ent: r.cand, exact: r.exact, ai: r.ai });
    if (r.how === "confirmed" || r.how === "rejected") checks.push({ kind: r.how, key, raw: d.raw, ent: r.cand || r.id });
    if (r.how === "none" || r.how === "rejected") { checks.push({ kind: "new", raw: d.raw }); return; }
    if (!r.id) return;
    const all = [];
    POLICIES.forEach(p => p.deps.forEach(x => { if (x.e === r.id) all.push({ p, x }); }));
    if (!all.length) { checks.push({ kind: "new", raw: d.raw }); return; }
    const ov = (l, a, b) => day(l.x.from) <= b && day(l.x.to) >= a;
    const isEx = l => !!S.excl[l.p.id + ":" + r.id];

}

    ${A.err ? `<p class="ai-warn">${esc(t("aiFail"))}</p>` : ""}
    ${r ? `<div class="ai-out">${A.fallback ? `<p class="ai-warn">${esc(t("aiFallback"))}</p>` : ""}<p class="section-label">${esc(t("aiFound"))}</p>${row("venue")}${row("power")}${row("stage")}
      <p class="form-hint">${A.fallback ? "" : esc(t("aiTook")((r.ms / 1000).toFixed(1))) + " "}${esc(t("aiModel"))}</p></div>` : ""}

function applyAI(r) {
  const c = S.custom;
  if (r.name) c.name = r.name;
  if (r.start) c.start = r.start;
  if (r.end) c.end = r.end;
  if (r.limit) c.limit = r.limit;
  if (r.ded) c.ded = r.ded;
  c.venue = r.venue ? r.venue.name : ""; c.power = r.power ? r.power.name : ""; c.powerCr = r.power ? r.power.cr : ""; c.stage = r.stage ? r.stage.name : ""; c.stageCr = r.stage ? r.stage.cr : "";
}
async function aiSuggest(r) {
  if (!(window.UqdahAI && UqdahAI.isLoaded())) return;
  for (const role of ["venue", "power", "stage"]) {
    const x = r[role]; if (!x) continue;
    const ids = Object.keys(ENT).filter(id => ENT[id].role === role);
    const names = [], owner = [];
    ids.forEach(id => { names.push(ENT[id].name.en, ENT[id].name.ar); owner.push(id, id); });
    const sims = await UqdahAI.similar(x.name, names);
    const best = {}; sims.forEach((v, i) => { if (!best[owner[i]] || v > best[owner[i]]) best[owner[i]] = v; });
    const rank = Object.entries(best).sort((a, b) => b[1] - a[1]);
    if (rank[0][1] >= 0.88 && rank[0][1] - (rank[1] ? rank[1][1] : 0) >= 0.03) S.aiSug[norm(x.name)] = { id: rank[0][0], sim: rank[0][1] };
  }
}
async function runAI() {
  const A = S.ai, box = document.getElementById("aiText");
  A.text = box ? box.value : A.text;
  A.err = false; A.fallback = false; A.busy = true; A.pct = null;
  const rerender = () => { const el = document.querySelector(".ai-panel"); if (el) el.outerHTML = aiPanel(); };
  try {
    if (!UqdahAI.isLoaded()) {
      A.pct = 0; A.status = t("aiLoading")(0); rerender();
      let last = -1;
      await UqdahAI.load(f => { const p = Math.round(f * 100); if (p !== last) { last = p; A.pct = p; A.status = t("aiLoading")(p); const st = document.getElementById("aiStatus"); if (st) st.innerHTML = `${esc(A.status)}<div class="track" style="margin-top:6px"><div class="fill now" style="width:${p}%"></div></div>`; } });
    }
    A.pct = null; A.status = t("aiReading"); rerender();
    const r = await UqdahAI.extract(A.text);
    await aiSuggest(r);
    A.result = r; A.status = ""; applyAI(r);
  } catch (e) {
    console.warn(e);
    const which = A.text.trim() === AI_EX.en.trim() ? "en" : A.text.trim() === AI_EX.ar.trim() ? "ar" : null;
    A.status = "";
    if (which) { A.result = AI_SAVED[which]; A.fallback = true; applyAI(A.result); } else { A.err = true; A.result = null; }
  }
  A.busy = false;
  renderCheck();
}

  document.getElementById("themeBtn").textContent = theme() === "dark" ? t("light") : t("dark");
}
function show(v, navV) {
  ["simple", "demo", "check", "how"].forEach(n => { document.getElementById("view-" + n).hidden = n !== v; });
  document.querySelectorAll("nav.views a").forEach(a => a.dataset.view === (navV || v) ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}
function renderAll() { chrome(); renderSimple(); renderDemo(); renderCheck(); renderHow(); renderGuide(false); }
document.getElementById("langBtn").addEventListener("click", () => { S.lang = S.lang === "en" ? "ar" : "en"; store.set("uqdah.lang", S.lang); closeDoc(); renderAll(); });
document.getElementById("themeBtn").addEventListener("click", () => { const n = theme() === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); store.set("uqdah.theme", n); chrome(); });
const th = store.get("uqdah.theme"); if (th === "dark" || th === "light") document.documentElement.setAttribute("data-theme", th);
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", chrome); } catch (e) {}
function route() {
  const h = location.hash.slice(1);
  const v = h === "how" ? "how" : h === "check" ? "check" : h === "demo" ? "demo" : "simple";
  if (typeof S.tour === "number") { S.tour = null; renderGuide(false); }
  if (v === "demo") { S.tour = null; renderDemo(); }
  show(v);
}
window.addEventListener("hashchange", route);
window.UQDAH = { ENT, POLICIES, APPS, analyse };
renderAll(); route();
})();
